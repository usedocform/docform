name: Publish packages to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: >
          pnpm
          --filter @docform/core
          --filter @docform/ai
          --filter @docform/api
          --filter @docform/mcp-server
          --filter @docform/cli
          --filter @docform/sdk-js
          build

      - name: Publish packages
        run: >
          pnpm -r
          --filter @docform/core
          --filter @docform/ai
          --filter @docform/api
          --filter @docform/mcp-server
          --filter @docform/cli
          --filter @docform/sdk-js
          publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
